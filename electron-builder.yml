appId: io.erdmaker.studio
productName: ERD Maker
artifactName: ERD-Maker-${version}-${os}-${arch}.${ext}
directories:
  app: .
  output: release
files:
  - dist/**/*
  - app/desktop/main.cjs
  - package.json
  - '!REF{,/**/*}'
  - '!research{,/**/*}'
  - '!**/*.map'
asar: true
npmRebuild: false
publish: null
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target:
    - AppImage
    - tar.gz
